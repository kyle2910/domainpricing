<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | DomainPricing</title>
  <meta name="description" content="The page you are looking for does not exist.">
  <style>
    /* ===== CSS Variables (Light Theme - Default) ===== */
    :root {
      --base-100: oklch(100% 0 0);
      --base-200: oklch(97.8% 0 0);
      --base-300: oklch(94% 0 0);
      --base-content: oklch(15% 0 0);
      --primary: oklch(58% 0.2 255);
      --radius-box: 0.5rem;
      --radius-field: 0.375rem;
    }

    /* ===== Dark Theme (Auto) ===== */
    @media (prefers-color-scheme: dark) {
      :root {
        --base-100: oklch(15% 0 0);
        --base-200: oklch(18% 0 0);
        --base-300: oklch(23% 0 0);
        --base-content: oklch(94% 0 0);
        --primary: oklch(72% 0.17 45);
      }
    }

    /* ===== Reset & Base ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--base-100);
      color: var(--base-content);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ===== Layout ===== */
    .container {
      max-width: 64rem; /* max-w-5xl = 1024px */
      margin: 0 auto;
      padding: 0 1rem;
      width: 100%;
    }

    @media (min-width: 640px) {
      .container {
        padding: 0 1.5rem;
      }
    }

    /* ===== Header ===== */
    header {
      border-bottom: 1px solid var(--base-300);
      padding: 1rem 0;
    }

    header .container {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-weight: 700;
      font-size: 1.125rem;
      color: var(--base-content);
      text-decoration: none;
    }

    .logo span {
      color: var(--primary);
    }

    /* ===== Main Content ===== */
    main {
      flex: 1;
      padding: 1.5rem 0;
    }

    @media (min-width: 640px) {
      main {
        padding: 2.5rem 0;
      }
    }

    .error-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 2.5rem 0;
    }

    @media (min-width: 640px) {
      .error-content {
        padding: 4rem 0;
      }
    }

    /* ===== 404 Number ===== */
    .error-code {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-variant-numeric: tabular-nums;
      font-size: 4.5rem;
      font-weight: 700;
      color: var(--primary);
      line-height: 1;
      margin-bottom: 1.5rem;
    }

    @media (min-width: 640px) {
      .error-code {
        font-size: 6rem;
      }
    }

    /* ===== Typography ===== */
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
    }

    @media (min-width: 640px) {
      h1 {
        font-size: 1.875rem;
      }
    }

    h1 .highlight {
      color: var(--primary);
    }

    .description {
      color: color-mix(in oklab, var(--base-content) 70%, transparent);
      max-width: 65ch;
      margin-bottom: 2rem;
    }

    /* ===== Buttons ===== */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      align-items: center;
    }

    @media (min-width: 640px) {
      .btn-group {
        flex-direction: row;
      }
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.5rem 1rem;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 0.875rem;
      font-weight: 500;
      border-radius: var(--radius-field);
      border: 1px solid transparent;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s ease;
    }

    @media (min-width: 640px) {
      .btn {
        padding: 0.625rem 1.25rem;
      }
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    .btn-ghost {
      background-color: transparent;
      color: var(--base-content);
      border-color: var(--base-300);
    }

    .btn-ghost:hover {
      background-color: var(--base-200);
    }

    /* ===== Footer ===== */
    footer {
      border-top: 1px solid var(--base-300);
      padding: 1.5rem 0;
      margin-top: auto;
    }

    .footer-note {
      font-size: 0.75rem;
      color: color-mix(in oklab, var(--base-content) 50%, transparent);
      text-align: center;
    }

    /* ===== Accessibility ===== */
    a:focus-visible,
    button:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header>
    <div class="container">
      <a href="/" class="logo">
        Domain<span>Pricing</span>
      </a>
    </div>
  </header>

  <!-- Main Content -->
  <main>
    <div class="container">
      <div class="error-content">
        <!-- Large 404 -->
        <div class="error-code">404</div>

        <!-- Heading -->
        <h1>
          Page <span class="highlight">Not Found</span>
        </h1>

        <!-- Description -->
        <p class="description">
          Sorry, the page you are looking for does not exist or has been moved.
          Please check the URL or head back to the homepage.
        </p>

        <!-- Action Buttons -->
        <div class="btn-group">
          <a href="/" class="btn btn-primary">
            ← Back to Home
          </a>
          <a href="/search" class="btn btn-ghost">
            Domain search
          </a>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="container">
      <p class="footer-note">
        If you believe this is a mistake, please contact support.
      </p>
    </div>
  </footer>
</body>
</html>
